<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Subir Documento - Laboratorio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
    border: 1px solid #334155;
  }
  .icon-top {
    width: 64px; height: 64px;
    background: #2563eb;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
  }
  h1 {
    color: #f1f5f9;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
  }
  p.sub {
    color: #94a3b8;
    font-size: 14px;
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .drop-zone {
    border: 2px dashed #334155;
    border-radius: 14px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 20px;
    position: relative;
  }
  .drop-zone.has-file {
    border-color: #2563eb;
    background: rgba(37,99,235,0.07);
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 36px; margin-bottom: 10px; }
  .drop-label { color: #64748b; font-size: 14px; line-height: 1.5; }
  .file-name {
    color: #60a5fa; font-size: 13px;
    font-weight: 600; margin-top: 8px; word-break: break-all;
  }
  .btn {
    width: 100%; padding: 15px;
    background: #2563eb; color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .progress-wrap { display: none; margin-top: 16px; }
  .progress-bar-bg {
    background: #334155; border-radius: 99px;
    height: 8px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: #2563eb;
    border-radius: 99px; width: 0%;
    transition: width 0.3s;
  }
  .progress-label {
    color: #94a3b8; font-size: 12px;
    text-align: center; margin-top: 8px;
  }
  .result { display: none; text-align: center; padding: 20px 0 4px; }
  .result .icon-r { font-size: 48px; margin-bottom: 12px; }
  .result .msg { color: #f1f5f9; font-size: 16px; font-weight: 600; }
  .result .msg-sub { color: #94a3b8; font-size: 13px; margin-top: 6px; }
  .tipos {
    color: #475569; font-size: 11px;
    text-align: center; margin-top: 16px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon-top">📄</div>
  <h1>Subir documento</h1>
  <p class="sub">Selecciona el archivo que deseas enviar al encargado del laboratorio.</p>

  <div id="mainForm">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="*/*" onchange="onFileChange(this)">
      <div class="drop-icon">📂</div>
      <div class="drop-label">Toca para seleccionar un archivo</div>
      <div class="file-name" id="fileName"></div>
    </div>

    <button class="btn" id="btnEnviar" onclick="uploadFile()" disabled>Enviar documento</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-label" id="progressLabel">Subiendo...</div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="icon-r" id="resultIcon">✅</div>
    <div class="msg" id="resultMsg">Documento enviado!</div>
    <div class="msg-sub" id="resultSub">El encargado ya puede verlo e imprimirlo.</div>
    <br>
    <button class="btn" onclick="resetForm()" style="margin-top:8px">Enviar otro</button>
  </div>

  <div class="tipos">PDF - Word - Excel - PowerPoint - Imagenes - TXT y mas</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC3GLX8WbDuYLEjridvrqCeq9hpAyDcqb4",
    authDomain: "imprimir-9ec25.firebaseapp.com",
    projectId: "imprimir-9ec25",
    storageBucket: "imprimir-9ec25.firebasestorage.app",
    messagingSenderId: "993066100900",
    appId: "1:993066100900:web:93db37888ea43e4a989e31"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.onFileChange = function(input) {
    const file = input.files[0];
    if (file) {
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('dropZone').classList.add('has-file');
      document.getElementById('btnEnviar').disabled = false;
    }
  };

  window.uploadFile = async function() {
    const input = document.getElementById('fileInput');
    const file = input.files[0];
    if (!file) return;

    const btn = document.getElementById('btnEnviar');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');

    btn.disabled = true;
    progressWrap.style.display = 'block';
    progressLabel.textContent = 'Subiendo archivo...';

    // Simular progreso mientras sube a file.io
    let prog = 0;
    const progInterval = setInterval(() => {
      prog = Math.min(prog + Math.random() * 15, 85);
      progressBar.style.width = prog + '%';
    }, 400);

    try {
      // 1. Convertir archivo a base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      clearInterval(progInterval);
      progressBar.style.width = '90%';
      progressLabel.textContent = 'Enviando al encargado...';

      // 2. Guardar archivo en Firestore como base64
      await addDoc(collection(db, 'documentos'), {
        nombre: file.name,
        tamano: file.size,
        tipo: file.type || 'desconocido',
        datos: base64,
        fecha: serverTimestamp(),
        descargado: false
      });

      progressBar.style.width = '100%';
      progressLabel.textContent = 'Completado';

      setTimeout(() => {
        progressWrap.style.display = 'none';
        document.getElementById('mainForm').style.display = 'none';
        const res = document.getElementById('result');
        res.style.display = 'block';
        document.getElementById('resultIcon').textContent = '✅';
        document.getElementById('resultMsg').textContent = 'Documento enviado!';
        document.getElementById('resultSub').textContent = 'El encargado ya puede verlo e imprimirlo.';
      }, 600);

    } catch (err) {
      clearInterval(progInterval);
      progressWrap.style.display = 'none';
      btn.disabled = false;
      alert('Error al enviar: ' + err.message + '\nVerifica tu conexion a internet.');
    }
  };

  window.resetForm = function() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('mainForm').style.display = 'block';
    document.getElementById('fileInput').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('dropZone').classList.remove('has-file');
    document.getElementById('btnEnviar').disabled = true;
    document.getElementById('progressBar').style.width = '0%';
  };
</script>
</body>
</html>
